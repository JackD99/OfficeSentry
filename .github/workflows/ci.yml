name: CI
# v1 portal checks. Scoped to v1 paths so v2-only changes (checked by v2.yml)
# don't inherit v1's existing lint failures.
on:
  push:
    paths: ["portal/**", "tests/**", "scripts/**", "requirements*.txt", "pyproject.toml"]
  pull_request:
    paths: ["portal/**", "tests/**", "scripts/**", "requirements*.txt", "pyproject.toml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check portal/ tests/
      - run: python -m pytest tests/ -v --tb=short
      - run: bandit -r portal/ -ll
