name: ui
# Screenshots and accessibility checks in a real browser (v2/tests/browser/README.md): about 34 pages at a
# laptop and a phone width, light and dark, compared with the baselines in the repo, and axe-core on each.
#
# It costs minutes on GitHub Free, so it runs only on pull requests that touch what a page looks like, weekly
# (while the repo is private; nightly once public), and by hand. Screenshots are uploaded only when a
# comparison fails, and kept for three days.
#
# To refresh the baselines after an intended change: Actions > ui > Run workflow, pick the branch, tick
# "Save new baselines". It commits them to that branch. Look at the new images in the pull request.
on:
  pull_request:
    paths:
      - 'v2/officesentry/web/templates/**'
      - 'v2/officesentry/web/static/**'
      - 'v2/officesentry/web/styleguide.py'
      - 'v2/officesentry/reports/charts.py'
      - 'v2/scripts/screenshots.py'
      - 'v2/scripts/demo_data.py'
      - 'v2/tests/browser/**'
      - '.github/workflows/ui.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      update:
        description: 'Save new baselines and commit them to this branch'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: v2

jobs:
  browser:
    if: ${{ !inputs.update }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Pinned: the same Chromium, fonts and libraries that made the baselines. Change the version here, in
    # tests/browser/requirements.in and in README.md together, then refresh the baselines.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install from the lock files
        run: pip install --root-user-action=ignore --require-hashes --no-deps -r requirements-dev.txt -r tests/browser/requirements.txt
      - name: Screenshots and accessibility
        run: python -m pytest tests/browser --ui -p no:cacheprovider
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshots
          path: v2/tests/browser/output/
          retention-days: 3
          if-no-files-found: ignore

  update:
    if: ${{ inputs.update }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # commits the new baselines to the branch it ran on
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install from the lock files
        run: pip install --root-user-action=ignore --require-hashes --no-deps -r requirements-dev.txt -r tests/browser/requirements.txt
      - name: Save new baselines (accessibility still checked)
        run: python -m pytest tests/browser --ui --update -p no:cacheprovider
      - name: Commit them
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines
          if git diff --cached --quiet; then echo "The baselines already match."; exit 0; fi
          git commit -m "Update screenshot baselines"
          git push origin "HEAD:$BRANCH"
