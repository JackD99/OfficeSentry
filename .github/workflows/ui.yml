name: Browser tests
# Screenshots and accessibility checks in a real browser (v2/tests/browser/README.md): about 34 pages at a
# laptop and a phone width, light and dark, compared with the baselines in the repo, and axe-core on each.
# Beside it, the Layout job opens every page at four widths for broken layouts (v2/tests/layout/README.md); it
# reports only, for now, on the run's summary page.
#
# It runs on pull requests that touch what a page looks like, weekly, and by hand. Screenshots are uploaded only when a
# comparison fails, and kept for three days.
#
# To refresh the baselines after an intended change: add the label "refresh-baselines" to the pull request
# (refresh-baselines.yml), or Actions > Browser tests > Run workflow, pick the branch, tick "Save new baselines".
# Either commits them to that branch. Look at the new images in the pull request.
on:
  pull_request:
    paths:
      # What a page looks like comes from the templates and styles, but also from what the view and the
      # report builder put on it, so a change to either runs the screenshots too.
      - 'v2/officesentry/web/**'
      - 'v2/officesentry/reports/**'
      - 'v2/officesentry/home.py'
      - 'v2/officesentry/month_end.py'
      - 'v2/scripts/screenshots.py'
      - 'v2/scripts/demo_data.py'
      - 'v2/tests/browser/**'
      - 'v2/tests/layout/**'
      - '.github/workflows/ui.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      update:
        description: 'Save new baselines and commit them to this branch'
        type: boolean
        default: false
      pull_request:
        description: 'Compare the branch merged with main, as a pull request run does (its number)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: v2

jobs:
  browser:
    if: ${{ !inputs.update }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Pinned: the same Chromium, fonts and libraries that made the baselines. Change the version here, in
    # tests/browser/requirements.in and in README.md together, then refresh the baselines.
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.pull_request && format('refs/pull/{0}/merge', inputs.pull_request) || '' }}
      - name: Install from the lock files
        run: pip install --root-user-action=ignore --require-hashes --no-deps -r requirements-dev.txt -r tests/browser/requirements.txt
      - name: Screenshots and accessibility
        run: python -m pytest tests/browser --ui -p no:cacheprovider
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshots
          path: v2/tests/browser/output/
          retention-days: 3
          if-no-files-found: ignore

  # Every page at 1366, 1440 and 1920 px and on a phone, with long names and empty states, for pages that
  # scroll sideways, cut text off, overlap or push controls off the screen (v2/tests/layout/README.md).
  layout:
    name: Layout
    if: ${{ !inputs.update }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.pull_request && format('refs/pull/{0}/merge', inputs.pull_request) || '' }}
      - name: Install from the lock files
        run: pip install --root-user-action=ignore --require-hashes --no-deps -r requirements-dev.txt -r tests/browser/requirements.txt
      - name: Every page at four widths
        # Report only until the pages it lists are fixed: the job passes whatever it finds, and the run's summary
        # page lists every problem. Then remove continue-on-error so a new problem fails the pull request.
        continue-on-error: true
        run: python -m pytest tests/layout --layout -n 4 -p no:cacheprovider -q --tb=no -rf
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: layout
          path: v2/tests/layout/output/
          retention-days: 7
          if-no-files-found: ignore

  update:
    if: ${{ inputs.update }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # commits the new baselines to the branch it ran on
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install from the lock files
        run: pip install --root-user-action=ignore --require-hashes --no-deps -r requirements-dev.txt -r tests/browser/requirements.txt
      - name: Save new baselines (accessibility still checked)
        run: python -m pytest tests/browser --ui --update -p no:cacheprovider
      - name: Commit them
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines
          if git diff --cached --quiet; then echo "The baselines already match."; exit 0; fi
          git commit -m "Update screenshot baselines"
          git push origin "HEAD:$BRANCH"
