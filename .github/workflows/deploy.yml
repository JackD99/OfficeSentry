name: Deploy
# Deploys v2 to a Hetzner Cloud server and runs the everyday server jobs, all
# from GitHub (the mobile app's "Run workflow" button works). The server's
# Hetzner Cloud Firewall keeps SSH closed: each run opens port 22 to this
# runner's address only, and closes it again at the end, even if a step fails.
# Setup is in v2/DEPLOY.md ("Hetzner, from a phone").
#
# Run logs will be public once the repository is, so nothing here prints the
# first-admin link, the portal's logs or a secret: the status action reports
# health and error counts only.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: deploy
        options: [deploy, status, setup-link, backup, restart]
      ref:
        description: Branch, tag or commit to deploy (deploy only)
        default: main
  # Deploy main after its tests pass, once AUTO_DEPLOY is set to "true".
  workflow_run:
    workflows: [v2]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One run at a time, and never cancel a deploy half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # An automatic deploy only goes ahead for main's newest commit, so re-running
  # an older run of the tests can't put older code on a newer database.
  latest:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main" = "$SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $SHA: main has moved on to $main."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    needs: latest
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push' && needs.latest.outputs.ok == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      DEPLOYS: ${{ (inputs.action || 'deploy') == 'deploy' }}
      HOST: ${{ vars.DEPLOY_HOST }}
      # The demo site is on while DEMO_ENABLED is "true"; every deploy then
      # rebuilds its data from the code being deployed.
      DEMO: ${{ vars.DEMO_ENABLED == 'true' && (inputs.action || 'deploy') == 'deploy' }}
      DEMO_DOMAIN: ${{ vars.DEMO_ENABLED == 'true' && vars.OFFICESENTRY_DEMO_DOMAIN || '' }}
      FIREWALL: ${{ vars.HCLOUD_FIREWALL || 'officesentry' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      API: https://api.hetzner.cloud/v1
      # Marks the temporary rule so it is the only one this workflow removes.
      RULE: github-actions-deploy (temporary)
    steps:
      - name: Check the settings
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD != '' }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          DOMAIN: ${{ vars.OFFICESENTRY_DOMAIN }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST (variable)"
          [ -n "$HCLOUD_TOKEN" ] || missing="$missing HCLOUD_TOKEN (secret)"
          [ "$HAS_KEY" = true ] || missing="$missing DEPLOY_SSH_KEY (secret)"
          if [ "$DEPLOYS" = true ] || [ "$ACTION" = setup-link ]; then
            [ -n "$DOMAIN" ] || missing="$missing OFFICESENTRY_DOMAIN (variable)"
          fi
          if [ "$ACTION" = setup-link ] && [ "${#SETUP_CODE}" -lt 20 ]; then
            echo "::error::The setup-link action needs a SETUP_CODE secret of at least 20 characters (a long random password works). Add it under Settings > Secrets and variables > Actions > New repository secret, then run this again. v2/DEPLOY.md, step 6, has the steps."
            exit 1
          fi
          if [ "$DEMO" = true ] && [ -z "$DEMO_DOMAIN" ]; then missing="$missing OFFICESENTRY_DEMO_DOMAIN (variable)"; fi
          if [ "$DEMO" = true ] && [ "$HAS_DEMO_PASSWORD" != true ]; then missing="$missing DEMO_PASSWORD (secret)"; fi
          if [ -n "$missing" ]; then
            echo "::error::Set these under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7
        if: env.DEPLOYS == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}

      - name: Write the server's settings files
        if: env.DEPLOYS == 'true'
        env:
          DOMAIN: ${{ vars.OFFICESENTRY_DOMAIN }}
          TIMEZONE: ${{ vars.OFFICESENTRY_TIMEZONE || 'UTC' }}
          EXTRA: ${{ vars.OFFICESENTRY_SETTINGS }}
        run: |
          umask 077
          {
            echo "# Written by the Deploy workflow; edit the repository variables instead."
            # docker compose reads this too: which optional parts run.
            if [ -n "$DEMO_DOMAIN" ]; then echo "COMPOSE_PROFILES=https,demo"; else echo "COMPOSE_PROFILES=https"; fi
            # And which files: this server builds the deployed commit itself rather than pulling a release
            # (commits from before releases existed always build).
            if [ -f v2/docker-compose.build.yml ]; then echo "COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml"; fi
            echo "OFFICESENTRY_DOMAIN=$DOMAIN"
            echo "OFFICESENTRY_DEMO_DOMAIN=$DEMO_DOMAIN"
            echo "OFFICESENTRY_BASE_URL=https://$DOMAIN"
            echo "OFFICESENTRY_TIMEZONE=$TIMEZONE"
            echo "OFFICESENTRY_TRUSTED_PROXIES=1"
            printf '%s\n' "$EXTRA"
          } > v2/.env
          # The demo site: fictional tenants that can't be collected, so the
          # nightly collection runs once a year; no two-step sign-in, so
          # colleagues can share the demo account.
          {
            echo "OFFICESENTRY_BASE_URL=https://$DEMO_DOMAIN"
            echo "OFFICESENTRY_TIMEZONE=$TIMEZONE"
            echo "OFFICESENTRY_TRUSTED_PROXIES=1"
            echo "OFFICESENTRY_REQUIRE_MFA=off"
            echo "OFFICESENTRY_COLLECT_CRON=0 3 1 1 *"
          } > v2/.env.demo

      - uses: actions/setup-python@v7
        if: env.DEMO == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/pyproject.toml

      - name: Make the demo data
        if: env.DEMO == 'true'
        working-directory: v2
        env:
          # Required while the demo is on, so its admin password never has to
          # appear in a run's log or summary.
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          pip install -q -e '.[dev]'
          OFFICESENTRY_BASE_URL="https://$DEMO_DOMAIN" python scripts/demo_data.py --data-dir "$RUNNER_TEMP/demo" > "$RUNNER_TEMP/demo.log"
          tar -czf "$RUNNER_TEMP/demo.tgz" -C "$RUNNER_TEMP/demo" .
          echo "Demo site: https://$DEMO_DOMAIN, user **demo**, the DEMO_PASSWORD secret" >> "$GITHUB_STEP_SUMMARY"

      - name: Open SSH to this runner in the Hetzner firewall
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          echo "::add-mask::$ip"
          fw=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "$API/firewalls?name=$FIREWALL" | jq '.firewalls[0]')
          if [ "$fw" = null ]; then
            echo "::error::No Hetzner Cloud Firewall named \"$FIREWALL\" (set HCLOUD_FIREWALL if yours is named differently)"
            exit 1
          fi
          echo "FIREWALL_ID=$(jq -r .id <<<"$fw")" >> "$GITHUB_ENV"
          # set_rules replaces the whole list: keep every rule except an old
          # temporary one, then add this run's.
          jq --arg ip "$ip/32" --arg rule "$RULE" '{rules: ([.rules[] | select(.description != $rule)]
              + [{direction: "in", protocol: "tcp", port: "22", source_ips: [$ip], description: $rule}])
              | map(with_entries(select(.value != null and .value != []))
                    | if .direction == "in" then del(.destination_ips) else del(.source_ips) end)}' <<<"$fw" > rules.json
          curl -fsS -X POST -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
            --data @rules.json "$API/firewalls/$(jq -r .id <<<"$fw")/actions/set_rules" > /dev/null

      # SSH only talks to a server whose host key matches the DEPLOY_HOST_KEY
      # secret, so a server swapped in at the same address gets nothing: not
      # the code, the settings or the demo password.
      - name: Prepare SSH and check the server's key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf 'Host server\n  HostName %s\n  User deploy\n  IdentityFile %s/.ssh/id_deploy\n  ServerAliveInterval 30\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOST" "$HOME" "$HOME" > ~/.ssh/config
          # The firewall change takes a few seconds to reach the server.
          for _ in $(seq 30); do nc -z -w 3 "$HOST" 22 && break; sleep 3; done
          # The key the server shows right now. It's only used to explain a
          # missing or wrong secret; ssh itself checks against the secret.
          seen=$(ssh-keyscan -t ed25519 "$HOST" 2>/dev/null | cut -d' ' -f2- || true)
          if [ -z "$HOST_KEY" ]; then
            echo "::error::Add the server's SSH key as a secret named DEPLOY_HOST_KEY (Settings > Secrets and variables > Actions > New repository secret), then run this again. The server at $HOST shows this key: ${seen:-none, as it did not answer}. If you created that server yourself, that's its key. v2/DEPLOY.md, step 5, has the steps."
            exit 1
          fi
          # Accept "ssh-ed25519 AAAA..." with or without the address in front.
          read -r a b c _ <<<"$HOST_KEY"
          case "$a" in ssh-*|ecdsa-*) want="$a $b" ;; *) want="$b $c" ;; esac
          if ! grep -qE '^(ssh-[a-z0-9-]+|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+/]+=*$' <<<"$want"; then
            echo "::error::The DEPLOY_HOST_KEY secret doesn't look like an SSH key. It should be one line starting ssh-ed25519 AAAA. v2/DEPLOY.md, step 5, has the steps."
            exit 1
          fi
          printf '%s %s\n' "$HOST" "$want" > ~/.ssh/known_hosts
          if [ -n "$seen" ] && [ "${want%% *}" = ssh-ed25519 ] && [ "$seen" != "$want" ]; then
            echo "::error::The server at $HOST shows a different SSH key from the DEPLOY_HOST_KEY secret, so nothing was sent to it. If you rebuilt or replaced the server, set DEPLOY_HOST_KEY to: $seen. If you didn't, change nothing and check the DEPLOY_HOST variable and the server in the Hetzner console."
            exit 1
          fi

      - name: Copy the app to the server
        if: env.DEPLOYS == 'true'
        run: |
          rsync -az --delete --exclude docker-compose.override.yml --exclude data/ \
            --exclude tests/ --exclude .coverage --exclude '__pycache__/' \
            v2/ server:/opt/officesentry/v2/

      - name: Build and start
        if: env.DEPLOYS == 'true'
        run: ssh server 'bash -s' < v2/deploy/start.sh

      - name: Load the demo data
        if: env.DEMO == 'true'
        run: |
          ssh server 'cd /opt/officesentry/v2 && docker compose stop demo-web demo-worker \
            && docker compose run --rm --no-deps -T --entrypoint sh demo-web -c "find /data -mindepth 1 -delete && tar -xz -C /data" \
            && docker compose up -d demo-web demo-worker' < "$RUNNER_TEMP/demo.tgz"
          ssh server 'bash -s' < v2/deploy/start.sh
          echo "Demo data loaded. The sign-in is in this run's summary."

      # The setup link would let whoever reads this log create the first admin,
      # so it never appears here. A deploy only says whether one is needed.
      - name: Check for an admin account
        if: env.ACTION == 'deploy'
        run: |
          if ssh server 'cd /opt/officesentry/v2 && docker compose exec -T web python -m officesentry setup-link' > /dev/null 2>&1; then
            echo "::notice::No admin account yet. Run Deploy again with the setup-link action (v2/DEPLOY.md, step 6)."
          fi

      # Makes the SETUP_CODE secret the one-time code for creating the first
      # admin. It goes to the server over SSH's input, never in a command line.
      - name: Set the first-admin code
        if: env.ACTION == 'setup-link'
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          DOMAIN: ${{ vars.OFFICESENTRY_DOMAIN }}
        run: |
          # Its output is the current link, so it's only searched, never shown.
          if ! out=$(ssh server 'cd /opt/officesentry/v2 && docker compose exec -T web python -m officesentry setup-link' 2>&1); then
            if grep -q "admin already exists" <<<"$out"; then
              echo "An admin already exists, so first-run setup is closed. Sign in instead."
              exit 0
            fi
            echo "::error::Couldn't ask the portal whether an admin exists. Run Deploy with the status action to see what's running."
            exit 1
          fi
          printf '%s' "$SETUP_CODE" | ssh server 'cd /opt/officesentry/v2 && docker compose exec -T web sh -c "umask 077 && cat > /data/setup-token"'
          echo "Open https://$DOMAIN/setup and enter your SETUP_CODE secret as the setup code." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Back up the database
        if: env.ACTION == 'backup'
        run: ssh server 'cd /opt/officesentry/v2 && docker compose exec -T web python -m officesentry backup --keep 14'

      - name: Restart
        if: env.ACTION == 'restart'
        run: ssh server 'cd /opt/officesentry/v2 && docker compose restart'

      # Health and counts only: the portal's own log names tenants, users and
      # addresses, so reading it needs a shell (v2/DEPLOY.md, "If you need a shell").
      - name: Status
        if: env.ACTION == 'status' || env.ACTION == 'restart'
        run: |
          ssh server bash -s <<'EOF'
          cd /opt/officesentry/v2
          docker compose ps --format 'table {{.Service}}\t{{.Status}}'
          df -h / | awk 'NR == 2 {print "Disk: " $5 " used, " $4 " free"}'
          docker compose exec -T worker python -m officesentry healthcheck worker 2>&1 && echo "Worker: checked in recently"
          for service in web worker; do
            n=$(docker compose logs --since 24h --no-log-prefix "$service" 2>/dev/null | grep -cE ' (ERROR|CRITICAL) |\[(ERROR|CRITICAL)\]' || true)
            echo "Errors logged by $service in the last 24 hours: $n"
          done
          EOF

      - name: Close SSH again
        if: always() && env.FIREWALL_ID != ''
        run: |
          fw=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "$API/firewalls/$FIREWALL_ID" | jq '.firewall')
          jq --arg rule "$RULE" '{rules: [.rules[] | select(.description != $rule)]
              | map(with_entries(select(.value != null and .value != []))
                    | if .direction == "in" then del(.destination_ips) else del(.source_ips) end)}' <<<"$fw" > rules.json
          curl -fsS -X POST -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
            --data @rules.json "$API/firewalls/$FIREWALL_ID/actions/set_rules" > /dev/null
          rm -f ~/.ssh/id_deploy
