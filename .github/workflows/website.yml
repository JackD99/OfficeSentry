name: website
# Builds the website (website/README.md) from the docs, so a pull request that breaks it (a doc listed in
# website/build.py renamed or removed, a template error) shows here rather than in the next deploy. The
# Deploy workflow builds it again and copies it to the server.
on:
  pull_request:
    paths: ['**.md', 'docs/**', 'examples/**', 'website/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install --require-hashes -r website/requirements.txt
      - run: python website/build.py
