name: CI
# The product's own checks (v2/ is the whole product): lint and format, the tests on Python 3.11, 3.12 and
# 3.13 with coverage, a subset on Windows, the Docker build and the dependency audit, on every pull request
# and push to main. The weekly run also catches newly published vulnerabilities in the dependencies. (On a
# private fork on GitHub Free, where minutes are limited, pull requests run Python 3.12 only and the Windows
# job waits for main and the weekly run: the jobs below check github.event.repository.private.)
#
# Each Python's tests run in four parts on separate machines at the same time (pytest --shard,
# tests/conftest.py), and Windows' in three, so a run takes minutes rather than a quarter of an hour. The
# coverage job then adds up the parts' coverage for the 90% floor and checks that every test ran in exactly
# one part (scripts/check_shards.py).
#
# Pull requests and pushes to main that only touch Markdown, docs/, examples/ or website/ skip the jobs
# (website.yml builds the site), but "CI passed" always runs and reports, so it can be the one required check
# on main: it fails when any job failed or was cancelled, and passes when they passed or were skipped for a
# docs-only change. It also needs the sign-off check (DCO) on pull requests from outside contributors
# (CONTRIBUTING.md, "Signing off"). A docs-only push to main still gets a passing run, so the release workflow
# can release that commit: its code is the code the push before it tested.
on:
  # No paths-ignore: a skipped workflow never reports, a required check that never reports blocks the merge,
  # and a commit on main with no run can't be released. The "changes" job decides instead.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. Every other run is grouped by its commit, so
# runs on main never wait for each other and every commit that lands there is fully tested. (Grouped by
# branch, they queued: GitHub keeps one waiting run per group and cancels it when a newer one arrives, so a
# merge landing between two others went untested, as c52d6b8 did on 12 October.)
concurrency:
  group: v2-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: v2

jobs:
  # Whether the pull request, or the push to main, changes anything but docs. Every other event tests
  # everything.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] \
              && git fetch -q --depth=1 origin "$BEFORE"; then
            # What main had before this push, against what it has now.
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          # In a case pattern, * also matches /.
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|examples/*|website/*) ;;
              *) code=true ;;
            esac
          done <<<"$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then echo "Only docs changed, so the tests are skipped." >> "$GITHUB_STEP_SUMMARY"; fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/requirements-dev.txt
      # The ruff the dev lock pins, with its hashes, so a new ruff release can't turn the lint red on its own
      # (Dependabot moves the lock, and the lint with it).
      - name: Install ruff from the dev lock
        run: |
          awk '/^ruff==/ {p = 1} p {print} p && !/\\$/ {exit}' requirements-dev.txt > "$RUNNER_TEMP/ruff.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/ruff.txt"
      - run: ruff check .
      - run: ruff format --check .
      # The server and deploy scripts (v2/deploy/, .github/scripts/): every tracked .sh file, with the
      # shellcheck the runner image ships, at its strictest level.
      - name: shellcheck the shell scripts
        working-directory: .
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=style

  test:
    name: test (Python ${{ matrix.python }}, part ${{ matrix.part }} of 4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pull requests in the private repo: 3.12 only (the Docker image's Python). Everything else, and every
        # pull request once the repo is public: 3.11, 3.12 and 3.13.
        python: ${{ fromJSON(github.event_name == 'pull_request' && github.event.repository.private && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
        # Change PARTS below with this list; the coverage job fails if a part is missing.
        part: [1, 2, 3, 4]
        include:
          - python: '3.12'  # the Docker image's Python
            coverage: true
    env:
      PARTS: 4
      PART: ${{ matrix.part }}
      NAME: tests-${{ matrix.python }}-${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: v2/requirements-dev.txt
      - name: Install Pango and HarfBuzz for PDF export (the libraries the Docker image has)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      # The locked versions the image ships (plus the test tools), so CI tests what is released. `pip check`
      # fails when the lock no longer satisfies pyproject.toml: CONTRIBUTING.md, "Dependencies", says how to
      # refresh it.
      - name: Install from the lock file
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .
          pip check
      - if: ${{ !matrix.coverage }}
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          pytest -n auto --shard "$PART/$PARTS" --shard-list "$RUNNER_TEMP/part/$NAME.json"
      # Branch coverage on Python 3.12 needs coverage's classic tracer (sys.monitoring only measures branches
      # from 3.14), which makes these parts the slowest. The coverage job adds the four up.
      - name: pytest with coverage (the coverage job checks the 90% floor)
        if: ${{ matrix.coverage }}
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          pytest -n auto --shard "$PART/$PARTS" --shard-list "$RUNNER_TEMP/part/$NAME.json" --cov=officesentry --cov-report=
          mv .coverage "$RUNNER_TEMP/part/$NAME.coverage"
      - name: Keep this part's test list (and coverage) for the coverage job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: ${{ runner.temp }}/part/
          if-no-files-found: error
          retention-days: 3
          overwrite: true  # re-running every job uploads each part again

  # The four parts of each Python's run, added up: every test collected ran in exactly one part, and the
  # Python 3.12 parts' coverage together meets the floor.
  coverage:
    name: Coverage and every test ran
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # the parts' files, from this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install coverage from the dev lock
        run: |
          awk '/^coverage==/ {p = 1} p {print} p && !/\\$/ {exit}' requirements-dev.txt > "$RUNNER_TEMP/coverage.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/coverage.txt"
      - name: Fetch every part's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'tests-*' --dir "$RUNNER_TEMP/parts"
      - name: Every test ran in exactly one part
        run: |
          set -o pipefail
          python scripts/check_shards.py "$RUNNER_TEMP/parts" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Coverage of the parts together (fails under 90%)
        id: combine
        run: |
          find "$RUNNER_TEMP/parts" -name '*.coverage' -print0 | xargs -0 coverage combine
          coverage report --skip-covered --fail-under=90
      - name: Coverage summary
        if: ${{ !cancelled() && steps.combine.outcome != 'skipped' }}
        run: |
          {
            echo "### Coverage: $(coverage report --format=total)% (the floor is 90%)"
            echo "<details><summary>Files below 100%, least covered first</summary>"
            echo
            coverage report --format=markdown --skip-covered --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    # Windows without Docker: no Pango, so PDF buttons fall back to print-ready pages and the tests that
    # need real PDF rendering skip themselves. The files below cover the parts that differ on Windows
    # (file modes, paths, SQLite files, the waitress server, date formats on the account page and in
    # emails). Not required until it has a run of passes.
    # On the weekly and manual runs, and on pull requests once the repo is public: while it's private, Windows
    # minutes count double against GitHub Free's allowance.
    name: test (Windows, no Pango, part ${{ matrix.part }} of 3)
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.repository.private && needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/pyproject.toml
      - run: pip install -e ".[dev]"
      # Six minutes a test rather than two: Windows runners are several times slower than Linux ones and vary
      # more, and on 12 October the isolation walk ran past two minutes there, which ends the worker process
      # (the only way the timeout can stop a test on Windows). Every thread's stack is logged ten seconds
      # before the limit, and the slowest tests are listed at the end.
      - run: >-
          pytest -n auto --timeout=360 -o faulthandler_timeout=350 --durations=20
          --shard ${{ matrix.part }}/3 tests/test_foundation.py tests/test_access.py tests/test_login_security.py
          tests/test_scheduling.py tests/test_backups.py tests/test_serve.py tests/test_recording.py
          tests/test_pdf_export.py tests/test_reports.py tests/test_email.py tests/test_encoding.py
          tests/test_user_profile.py tests/test_pages.py tests/test_isolation_walk.py

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The base image by its digest, from the first registry that gives it: the Dockerfile's (AWS's copy of
      # Docker Hub's official images), then Google's copy, then Docker Hub. Runners share addresses and each
      # registry limits what one address pulls anonymously; on 15 October AWS's answered 429 ("Data limit
      # exceeded") before anything was built. The digest names the bytes, so the image built is the same
      # whichever answers, and it's built from the Dockerfile with only that line changed.
      - name: Fetch the base image
        run: |
          from=$(sed -n 's/^FROM //p' Dockerfile)
          digest=${from##*@}
          repository=${from%%:*}
          library=${repository#public.ecr.aws/docker/}
          for source in "$repository" "mirror.gcr.io/$library" "docker.io/$library"; do
            if docker pull -q "$source@$digest"; then
              sed "s|^FROM .*|FROM $source@$digest|" Dockerfile > "$RUNNER_TEMP/Dockerfile"
              exit 0
            fi
            echo "::warning::$source didn't give the base image; trying the next registry"
          done
          exit 1
      - name: Build the image (not pushed)
        run: docker build -f "$RUNNER_TEMP/Dockerfile" -t officesentry:ci .
      - name: Start the portal and wait until it's healthy
        run: |
          docker run -d --name portal -e OFFICESENTRY_BASE_URL=https://sentry.example officesentry:ci
          for i in $(seq 30); do
            docker exec portal python -m officesentry healthcheck web && break
            sleep 2
          done
          docker exec portal python -m officesentry healthcheck web
      - name: Check pages, styles and PDF support inside the image
        run: |
          docker exec -i portal python - <<'EOF'
          import urllib.request
          for path in ("/login", "/static/app.css"):
              with urllib.request.urlopen(f"http://127.0.0.1:8000{path}") as resp:
                  assert resp.status == 200, path
          from weasyprint import HTML
          assert HTML(string="<h1>Office Sentry</h1>").write_pdf()[:4] == b"%PDF"
          import json
          from officesentry import __version__
          with urllib.request.urlopen("http://127.0.0.1:8000/health") as resp:
              assert json.load(resp) == {"ok": True, "version": __version__}
          EOF
          docker exec portal python -m officesentry worker --once
      # Only to debug a failure. This portal is thrown away with the runner, so
      # the first-admin link in its log leads nowhere.
      - if: failure()
        run: docker logs portal

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      # pip-audit and everything it needs, from their own hash-pinned lock.
      - run: pip install --require-hashes -r ../.github/requirements-ci.txt
      # Every hash-pinned lock, without resolving anything: what the Docker image installs, what CI tests
      # with, the browser and nightly tests, the website build and CI's own tools.
      - run: pip-audit --strict --disable-pip -r requirements.txt
      - run: pip-audit --strict --disable-pip -r requirements-dev.txt
      - run: pip-audit --strict --disable-pip -r tests/browser/requirements.txt
      - run: pip-audit --strict --disable-pip -r tests/nightly/requirements.txt
      - run: pip-audit --strict --disable-pip -r ../website/requirements.txt
      - run: pip-audit --strict --disable-pip -r ../.github/requirements-ci.txt

  # Developer Certificate of Origin (CONTRIBUTING.md, "Signing off"): every commit in a pull request from
  # outside the project carries a Signed-off-by line with its author's email. The maintainer's own pull
  # requests and Dependabot's don't need it.
  dco:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR)
            echo "Opened by a maintainer ($AUTHOR), so no sign-off is needed."; exit 0;;
          esac
          if [ "$AUTHOR" = "dependabot[bot]" ]; then echo "Dependabot: no sign-off needed."; exit 0; fi
          # Merge commits are skipped; every other commit needs "Signed-off-by: Name <author's email>".
          missing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '
            .[] | select((.parents | length) < 2)
            | (.commit.author.email | ascii_downcase) as $email
            | select([.commit.message | scan("(?:^|\\n)signed-off-by: [^\\n]*<([^>\\n]+)>[ \\t]*(?=\\n|$)"; "i") | .[0] | ascii_downcase]
                     | index($email) | not)
            | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"')
          if [ -n "$missing" ]; then
            echo "::error::These commits need a sign-off line matching their author's email:"
            printf '%s\n' "$missing"
            echo "Add it with: git rebase --signoff origin/main && git push --force-with-lease (CONTRIBUTING.md, \"Signing off\")."
            exit 1
          fi
          echo "Every commit is signed off."

  # The one check to require on main (see the top of this file). It always runs, so a pull request that only
  # changes docs can still merge.
  ci:
    name: CI passed
    if: always()
    needs: [changes, lint, test, coverage, docker, audit, dco]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          [ "$FAILED" = false ]
