name: v2
# v2 is the whole product. The repo is private on GitHub Free (2,000 Actions minutes a month, Windows
# minutes counting double), so pull requests run lint, the dependency audit, the Docker build and the
# tests on Python 3.12 with coverage. Pushes to main, the weekly run and manual runs add Python 3.11 and
# 3.13 and the Windows job; a failure there is fixed on main straight away. The weekly run also catches
# newly published vulnerabilities in the dependencies. When the repo goes public (standard runners are
# free there), put the full matrix back on pull requests.
#
# Changes that only touch Markdown, docs/ or examples/ don't run CI. If checks become required (at
# go-public), add a job that always runs and passes for those, or such PRs can't merge.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'examples/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'examples/**']
  workflow_dispatch:
  # The release workflow runs the full set (as for main) on the commit it releases.
  workflow_call:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. Runs on main always finish, so every commit
# that lands there is fully tested.
# github.workflow is the caller's name when the release workflow runs this one, so a release never queues
# behind (or gets replaced by) main's own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: v2

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/pyproject.toml
      - run: pip install 'ruff>=0.6'
      - run: ruff check .

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: 3.12 only (the Docker image's Python). Everything else: 3.11, 3.12 and 3.13.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
        include:
          - python: '3.12'  # the Docker image's Python
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: v2/requirements-dev.txt
      - name: Install Pango and HarfBuzz for PDF export (the libraries the Docker image has)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      # The locked versions the image ships (plus the test tools), so CI tests what is released. `pip check`
      # fails when the lock no longer satisfies pyproject.toml: CONTRIBUTING.md, "Dependencies", says how to
      # refresh it.
      - name: Install from the lock file
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .
          pip check
      - if: ${{ !matrix.coverage }}
        run: pytest -n auto
      - name: pytest with coverage (fails under 90%)
        if: ${{ matrix.coverage }}
        env:
          COVERAGE_CORE: sysmon
        run: pytest -n auto --cov=officesentry --cov-report=term:skip-covered --cov-fail-under=90
      - name: Coverage summary
        if: ${{ matrix.coverage && !cancelled() }}
        run: |
          {
            echo "### Coverage: $(coverage report --format=total)% (the floor is 90%)"
            echo "<details><summary>Files below 100%, least covered first</summary>"
            echo
            coverage report --format=markdown --skip-covered --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    # Windows without Docker: no Pango, so PDF buttons fall back to print-ready pages and the tests that
    # need real PDF rendering skip themselves. The files below cover the parts that differ on Windows
    # (file modes, paths, SQLite files, the waitress server). Not required until it has a run of passes.
    # Not on pull requests: Windows minutes count double against GitHub Free's allowance.
    name: test (Windows, no Pango)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -n auto tests/test_foundation.py tests/test_access.py tests/test_login_security.py
          tests/test_scheduling.py tests/test_backups.py tests/test_serve.py tests/test_recording.py
          tests/test_pdf_export.py tests/test_reports.py tests/test_email.py tests/test_encoding.py

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the image (not pushed)
        run: docker build -t officesentry:ci .
      - name: Start the portal and wait until it's healthy
        run: |
          docker run -d --name portal -e OFFICESENTRY_BASE_URL=https://sentry.example officesentry:ci
          for i in $(seq 30); do
            docker exec portal python -m officesentry healthcheck web && break
            sleep 2
          done
          docker exec portal python -m officesentry healthcheck web
      - name: Check pages, styles and PDF support inside the image
        run: |
          docker exec -i portal python - <<'EOF'
          import urllib.request
          for path in ("/login", "/static/app.css"):
              with urllib.request.urlopen(f"http://127.0.0.1:8000{path}") as resp:
                  assert resp.status == 200, path
          from weasyprint import HTML
          assert HTML(string="<h1>Office Sentry</h1>").write_pdf()[:4] == b"%PDF"
          import json
          from officesentry import __version__
          with urllib.request.urlopen("http://127.0.0.1:8000/health") as resp:
              assert json.load(resp) == {"ok": True, "version": __version__}
          EOF
          docker exec portal python -m officesentry worker --once
      - if: always()
        run: docker logs portal

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/pyproject.toml
      - run: pip install -r ../.github/requirements-ci.txt
      # Exactly what the Docker image installs: the hash-pinned lock, without resolving anything.
      - run: pip-audit --strict --disable-pip -r requirements.txt
