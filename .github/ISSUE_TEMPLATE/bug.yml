name: Bug report
description: Something in Office Sentry doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public. Don't paste client data.** Before you post, remove or replace tenant names and IDs,
        domains, user names and email addresses (UPNs), IP addresses, certificate thumbprints, client IDs and
        anything from a report or log that identifies a client or a person. Write `contoso.example` or
        `user1@contoso.example` instead.

        Found a security problem? Don't post it here: use
        [private vulnerability reporting](https://github.com/JackD99/OfficeSentry/security/advisories/new).

        Setup errors such as AADSTS50011 or "the background worker isn't running" are often covered in
        [Troubleshooting](https://github.com/JackD99/OfficeSentry/blob/main/v2/docs/troubleshooting.md). Fixes
        only go into the newest release, so if *Settings → Updates* offers one, update and try again first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a client's Overview
        2. Press ...
        3. See ...
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The version at the foot of the portal's menu, or in `/health`. If you run your own build of a
        branch, add its commit (`git rev-parse --short HEAD`).
      placeholder: 2.x.y
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker (docker compose), on a server or a cloud VM
        - Portainer, Dockge, Komodo, Coolify or Dokploy
        - Unraid, Synology or TrueNAS
        - Kubernetes
        - Windows without Docker
        - Linux without Docker
        - Development (python -m officesentry web)
    validations:
      required: true
  - type: textarea
    id: support_package
    attributes:
      label: Support package
      description: |
        Attach the support package: the zip from **Settings → Support** in the portal. If the portal won't open,
        make it on the server, in the folder with `docker-compose.yml`:
        `docker compose run --rm -T web python -m officesentry support-package --out - > support.zip`
        (without Docker: `python -m officesentry support-package`).
        It holds the versions, health, settings and recent log of your install, with secrets and client names
        taken out, so it's safe to attach here. Leave *Include client identifiers* unticked for a public issue.
        Drag the file into this box. It answers most of the questions we would otherwise ask
        ([what's in it](https://github.com/JackD99/OfficeSentry/blob/main/v2/docs/getting-help.md#whats-in-it-and-what-isnt)).
      placeholder: Drag the support-package zip here.
  - type: input
    id: error_reference
    attributes:
      label: Error reference
      description: >-
        If a page showed "Something went wrong on our side", the reference it gave. The same reference is on
        the error's log line and in the `X-Request-ID` response header, so it points us straight at the log entry.
      placeholder: e.g. 3f9a1c2b7d4e
  - type: dropdown
    id: cloud
    attributes:
      label: Microsoft cloud of the affected tenant
      options:
        - Commercial (includes GCC)
        - US Government GCC High
        - US Government DoD
        - China (21Vianet)
        - Not about a tenant
  - type: textarea
    id: logs
    attributes:
      label: Error message or log (redacted)
      description: |
        The error from the run's page, or the relevant lines of `docker compose logs web` or `docker compose logs worker`.
        Redact tenant IDs, domains, UPNs, IP addresses and names first. Keep Microsoft's error codes (such as
        `AADSTS50011` or `Authorization_RequestDenied`); they help and identify nobody.
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you post
      options:
        - label: I've removed tenant data, tenant IDs, domains, UPNs, IP addresses and names from everything above.
          required: true
