# Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front of "web".
services:
  web:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["officesentry-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "officesentry", "worker"]
    volumes: ["officesentry-data:/data"]
    restart: unless-stopped
volumes:
  officesentry-data:
