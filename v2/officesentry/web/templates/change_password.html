{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="password" minlength="{{ min_password }}" autocomplete="new-password" required></label>
    <label>Confirm <input type="password" name="confirm" minlength="{{ min_password }}" autocomplete="new-password" required></label>
    <button class="primary">Change password</button>
  </form>
</div>
{% endblock %}
