{% extends "base.html" %}
{% block title %}Change password · Office Sentry{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1><div class="sub">Signed in as {{ current_user.username }}.</div></div></div>
<div class="card narrow">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="password" minlength="{{ min_password }}" autocomplete="new-password" required>
      <span class="hint">At least {{ min_password }} characters. A short sentence works well.</span></label>
    <label>Confirm new password <input type="password" name="confirm" minlength="{{ min_password }}" autocomplete="new-password" required></label>
    <div class="form-actions"><button class="primary">Change password</button></div>
  </form>
</div>
{% endblock %}
