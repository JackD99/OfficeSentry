{% extends "base.html" %}
{% block title %}Sign in · Office Sentry{% endblock %}
{% block auth %}
<h1>Sign in</h1>
<p class="sub">Microsoft 365 security and licensing reports.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" required {% if not username %}autofocus{% endif %}></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required {% if username %}autofocus{% endif %}></label>
  <button class="primary">Sign in</button>
</form>
{% endblock %}
