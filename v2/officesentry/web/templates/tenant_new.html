{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Add tenant</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Display name <input name="name" maxlength="200" required autofocus></label>
    <label>Tenant ID or domain <input name="tenant_ref" placeholder="contoso.onmicrosoft.com" required></label>
    <label>App connection
      <select name="connection_id">
        {% for c in connections %}<option value="{{ c.id }}">{{ c.name }}{% if not c.client_id %} (no client ID yet){% endif %}</option>{% endfor %}
      </select>
    </label>
    {% if not connections %}<p class="muted">No app connection yet. <a href="{{ url_for('admin.connections') }}">Create one</a> first.</p>{% endif %}
    <button class="primary" {% if not connections %}disabled{% endif %}>Add tenant</button>
  </form>
</div>
{% endblock %}
