# Instead of ingress.yaml, for clusters that use the Gateway API: attach the portal to a Gateway you already run
# (its HTTPS listener holds the certificate). Set the Gateway's name and namespace, and your domain.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: officesentry
spec:
  parentRefs:
    - name: my-gateway
      namespace: gateway
  hostnames: [sentry.example.com]
  rules:
    - backendRefs:
        - name: officesentry
          port: 8000
