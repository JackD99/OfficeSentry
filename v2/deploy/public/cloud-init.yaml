#cloud-config
# Paste this into "Cloud config" when creating the public server (the website and the demo) in the Hetzner
# Cloud console, after replacing the ssh-ed25519 line below with the public half of the same deploy key the
# production server uses. Steps are in README.md here.
#
# It installs Docker, creates the "deploy" user that the "Deploy" GitHub workflow signs in as, and turns off
# password and root sign-in over SSH. Unlike the production server it keeps no data worth backing up.

users:
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...replace-with-your-deploy-public-key... officesentry-deploy

package_update: true
package_upgrade: true
packages: [docker.io, docker-compose-v2, rsync, unattended-upgrades]

write_files:
  - path: /etc/ssh/sshd_config.d/10-officesentry.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers deploy
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "local", "log-opts": {"max-size": "20m", "max-file": "5"}}

runcmd:
  # Docker's group only exists once its package is installed.
  - usermod -aG docker deploy
  - install -d -o deploy -g deploy /opt/officesentry /opt/officesentry/site
  - systemctl enable --now docker
  - systemctl restart docker
  - systemctl restart ssh
