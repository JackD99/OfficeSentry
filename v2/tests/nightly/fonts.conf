<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts the Docker image has (fonts-dejavu-core) and no others, so PDFs render here as they do for
     clients, whatever else the machine has installed. Reports bring their own fonts (web/static/fonts); charts and anything
     asking for "sans-serif" get DejaVu Sans. test_pdf_snapshots.py points FONTCONFIG_FILE here. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
