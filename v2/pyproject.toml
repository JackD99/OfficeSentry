[project]
name = "officesentry"
version = "2.0.0.dev0"
description = "Read-only Microsoft 365 reporting for MSPs"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Flask-WTF==1.2.2",
    "cryptography>=46",
    "msal>=1.31",
    "requests>=2.32.4",
    "gunicorn>=23",
    "openpyxl>=3.1",
    "dnspython>=2.6",
    "croniter>=6",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo has no system time zones on Windows
]

[project.optional-dependencies]
# PDF export. Needs Pango (the Docker image installs it).
pdf = ["weasyprint>=63"]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6", "weasyprint>=63"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["officesentry*"]

[tool.setuptools.package-data]
officesentry = ["migrations/*.sql", "web/templates/*.html", "web/templates/reports/*.html", "web/templates/emails/*.html", "web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
