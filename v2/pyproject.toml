[project]
name = "officesentry"
# The version is officesentry.__version__; CONTRIBUTING.md, "Releases", says when to change it.
dynamic = ["version"]
description = "Read-only Microsoft 365 reporting for MSPs"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "Flask==3.1.3",
    "Flask-WTF==1.3.0",
    "cryptography>=50.0.0",  # floors are the first releases without known vulnerabilities (pip-audit in CI)
    "msal>=1.31",
    "PyJWT>=2.15.0",  # through msal
    "requests>=2.32.4",
    "urllib3>=2.8.0",  # through requests
    "gunicorn>=23; sys_platform != 'win32'",
    "waitress>=3.0.2; sys_platform == 'win32'",  # `serve` on Windows, where gunicorn doesn't run
    "openpyxl>=3.1",
    "dnspython>=2.6",
    "segno>=1.6",
    "croniter>=6",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo has no system time zones on Windows
]

[project.optional-dependencies]
# PDF export. Needs Pango (the Docker image installs it).
pdf = ["weasyprint>=63"]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-xdist>=3.6", "pytest-timeout>=2.3", "responses>=0.25", "ruff>=0.6", "weasyprint>=63"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "officesentry.__version__"}

[tool.setuptools.packages.find]
include = ["officesentry*"]

[tool.setuptools.package-data]
officesentry = ["common_passwords.txt", "migrations/*.sql", "web/templates/*.html", "web/templates/reports/*.html", "web/templates/emails/*.html", "web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A test that hangs (a lock never released, a thread never joined, a mock never answered) fails after two
# minutes with every thread's stack, instead of the whole run waiting for the CI job's limit. The slowest
# test takes about 15 seconds on a loaded runner.
timeout = 120
# Ten seconds before that, every thread's stack goes to the log. Under pytest -n (xdist) on Windows the timeout
# can only end the worker process, and its own stack dump is lost with it ("node down: Not properly
# terminated"); this one isn't.
faulthandler_timeout = 110
filterwarnings = [
    # A thread that dies with an exception, or an exception Python could only print (from a __del__, a
    # callback), fails the test it happened in rather than passing with a note.
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
# Branches too: a line is run, but was the other way through the `if` ever taken? CI's floor (v2.yml) is
# on the combined figure, so an untested branch counts like an untested line.
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
