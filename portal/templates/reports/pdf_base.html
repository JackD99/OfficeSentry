<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ report_title | default("Report") }} — {{ tenant.name | default("") }}</title>
<style>
  @page {
    size: A4;
    margin: 2cm 1.5cm 2.5cm 1.5cm;
    @top-right { content: "{{ branding.company_name | default('M365 Audit Portal') }}"; font-size: 8pt; color: #666; }
    @bottom-center { content: "Page " counter(page) " of " counter(pages); font-size: 8pt; color: #888; }
    @bottom-right { content: "Generated {{ generated_at }}"; font-size: 7pt; color: #999; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 10pt; line-height: 1.5; color: #1a1a2e; }
  h1 { font-size: 20pt; font-weight: 700; color: {{ branding.accent_color | default('#0d6efd') }}; margin-bottom: 4pt; }
  h2 { font-size: 14pt; font-weight: 600; color: #1a1a2e; margin: 16pt 0 8pt 0; border-bottom: 2px solid {{ branding.accent_color | default('#0d6efd') }}; padding-bottom: 4pt; }
  h3 { font-size: 11pt; font-weight: 600; color: #333; margin: 12pt 0 6pt 0; }
  p { margin-bottom: 8pt; }
  .header { border-bottom: 3px solid {{ branding.accent_color | default('#0d6efd') }}; padding-bottom: 12pt; margin-bottom: 16pt; }
  .header-meta { font-size: 9pt; color: #666; margin-top: 4pt; }
  .header-tenant { font-size: 13pt; color: #333; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; margin: 8pt 0 16pt 0; font-size: 9pt; }
  th { background: #f0f4f8; font-weight: 600; text-align: left; padding: 6pt 8pt; border: 1px solid #dde; }
  td { padding: 5pt 8pt; border: 1px solid #dde; vertical-align: top; }
  tr:nth-child(even) { background: #fafbfc; }
  .badge { display: inline-block; padding: 2pt 8pt; border-radius: 3pt; font-size: 8pt; font-weight: 600; color: #fff; }
  .badge-pass { background: #198754; }
  .badge-fail { background: #dc3545; }
  .badge-warn { background: #ffc107; color: #333; }
  .badge-info { background: #0dcaf0; color: #333; }
  .badge-critical { background: #6f42c1; }
  .badge-high { background: #dc3545; }
  .badge-medium { background: #fd7e14; }
  .badge-low { background: #0d6efd; }
  .metric-row { display: flex; gap: 12pt; margin: 8pt 0 16pt 0; }
  .metric-card { flex: 1; background: #f8f9fa; border: 1px solid #dde; border-radius: 6pt; padding: 12pt; text-align: center; }
  .metric-value { font-size: 22pt; font-weight: 700; color: {{ branding.accent_color | default('#0d6efd') }}; }
  .metric-label { font-size: 8pt; color: #666; text-transform: uppercase; letter-spacing: 0.5pt; }
  .section { page-break-inside: avoid; margin-bottom: 12pt; }
  .no-data { color: #999; font-style: italic; padding: 12pt; text-align: center; }
  .footer-note { font-size: 8pt; color: #888; margin-top: 20pt; border-top: 1px solid #dde; padding-top: 8pt; }
</style>
</head>
<body>
{% block content %}{% endblock %}
<div class="footer-note">
  This report was automatically generated by {{ branding.company_name | default('M365 Audit Portal') }} on {{ generated_at }}.
  For questions or concerns, contact your IT service provider.
</div>
</body>
</html>
