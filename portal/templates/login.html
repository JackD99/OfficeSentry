<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — M365 Audit Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">

<div class="card" style="width:380px;max-width:95vw">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
      <h5 class="mt-2 fw-semibold">M365 Audit Portal</h5>
      <p class="text-muted small mb-0">Sign in to continue</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show small py-2" role="alert">
          {{ msg }}
          <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label small" for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="Enter username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small" for="password">Password</label>
        <div class="input-password-wrap">
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Enter password" required>
          <button type="button" class="btn-toggle-password" tabindex="-1"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.btn-toggle-password').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = btn.parentElement.querySelector('input');
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.querySelector('i').className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
});
</script>
</body>
</html>
