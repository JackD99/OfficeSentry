<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — M365 Audit Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="card">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="brand-logo">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h5 class="fw-bold mt-3" style="letter-spacing:-0.02em">M365 Audit Portal</h5>
        <p class="text-muted small mb-0" style="color:var(--color-text-tertiary)!important">Sign in to your account</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show small py-2 animate-fade-in" role="alert">
            {{ msg }}
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-control" id="username" name="username"
                 placeholder="Enter your username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="input-password-wrap">
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter your password" required>
            <button type="button" class="btn-toggle-password" tabindex="-1"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" style="font-weight:600">
          Sign In
        </button>
      </form>
    </div>
  </div>
  <p class="text-center mt-4" style="font-size:var(--text-xs);color:var(--color-text-quaternary)">
    Protected by certificate-based authentication
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.btn-toggle-password').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = btn.parentElement.querySelector('input');
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.querySelector('i').className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
});
</script>
</body>
</html>
