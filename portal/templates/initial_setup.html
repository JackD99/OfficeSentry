<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Initial Setup — M365 Audit Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body class="auth-page">

<div class="auth-card" style="width:440px">
  <div class="card">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="brand-logo">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h5 class="fw-bold mt-3" style="letter-spacing:-0.02em">Welcome to M365 Audit Portal</h5>
        <p class="small mb-0" style="color:var(--color-text-tertiary)">Create your admin account to get started</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show small py-2 animate-fade-in" role="alert">
            {{ msg }}
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-control" id="username" name="username"
                 placeholder="Choose a username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-password-wrap">
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="At least 8 characters" required minlength="8">
            <button type="button" class="btn-toggle-password" tabindex="-1"><i class="bi bi-eye"></i></button>
          </div>
          <div class="password-strength mt-1">
            <div class="password-strength-fill" id="pw-strength-fill"></div>
          </div>
          <small id="pw-strength-text" style="font-size:.7rem;color:var(--color-text-quaternary)"></small>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirm">Confirm Password</label>
          <div class="input-password-wrap">
            <input type="password" class="form-control" id="confirm" name="confirm"
                   placeholder="Re-enter password" required minlength="8">
            <button type="button" class="btn-toggle-password" tabindex="-1"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" style="font-weight:600">
          <i class="bi bi-person-plus me-2"></i>Create Admin Account
        </button>
      </form>
    </div>
  </div>
  <p class="text-center mt-4" style="font-size:var(--text-xs);color:var(--color-text-quaternary)">
    Your data is encrypted and stored locally
  </p>
</div>

<script nonce="{{ g.csp_nonce }}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script nonce="{{ g.csp_nonce }}">
// Password toggle
document.querySelectorAll('.btn-toggle-password').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = btn.parentElement.querySelector('input');
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.querySelector('i').className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
});

// Password strength indicator
document.getElementById('password').addEventListener('input', function() {
  const pw = this.value;
  let score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if (/\d/.test(pw))   score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const fill = document.getElementById('pw-strength-fill');
  const text = document.getElementById('pw-strength-text');
  const levels = [
    { w: '0%',   c: 'var(--color-bg-subtle)', t: '' },
    { w: '20%',  c: 'var(--color-accent-red)', t: 'Weak' },
    { w: '40%',  c: 'var(--color-accent-amber)', t: 'Fair' },
    { w: '60%',  c: 'var(--color-accent-amber)', t: 'Good' },
    { w: '80%',  c: 'var(--color-accent-green)', t: 'Strong' },
    { w: '100%', c: 'var(--color-accent-green)', t: 'Very strong' },
  ];
  const l = levels[score] || levels[0];
  fill.style.width = l.w;
  fill.style.background = l.c;
  text.textContent = l.t;
  text.style.color = l.c;
});
</script>
</body>
</html>
